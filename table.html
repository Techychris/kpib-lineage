<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kappa Pi Beta · Member Table</title>
<style>
:root{color-scheme:dark;--bg:#0c111a;--panel:#151e2b;--ink:#f0f4fc;--muted:#aab8cd;--line:#344155;--accent:#f69d82;--focus:#ffd5ca;font:16px system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}a{color:inherit}
main{max-width:1160px;margin:auto;padding:20px clamp(12px,4vw,40px) 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{color:var(--accent);font-size:.85rem;font-weight:750;text-decoration:none;text-transform:uppercase;letter-spacing:.08em}
h1{font:500 clamp(1.8rem,5vw,3rem)/1.08 Georgia,serif;margin:4px 0 0}
nav{display:flex;gap:4px}nav a{display:grid;place-items:center;min-height:44px;padding:7px 12px;text-decoration:none;border:1px solid var(--line);border-radius:6px}
nav a[aria-current]{border-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;align-items:end;gap:8px 12px;padding:12px;border:1px solid var(--line);background:var(--panel);border-radius:8px 8px 0 0}
.filters label{display:grid;gap:4px;min-width:0;font-size:.83rem;color:var(--muted)}
.filters label:first-child{flex:1 1 180px}.filters label:nth-child(2){flex:0 1 235px}
input,select{font:inherit;font-size:1rem;width:100%;min-height:44px;padding:7px 10px;color:var(--ink);background:#0f1722;border:1px solid #53627b;border-radius:6px}
a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#status{width:100%;font-size:.83rem;color:var(--muted);margin:0}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
th{background:#1c2a3d;font-size:.85rem}td{font-size:.92rem}
th:nth-child(1){width:31%}th:nth-child(2){width:22%}th:nth-child(3){width:26%}th:nth-child(4){width:21%}
td a{display:inline-block;text-decoration-color:#6e849e;text-underline-offset:3px;min-height:24px}
td a:hover{color:var(--accent)}td small{display:block;color:var(--muted);margin-top:3px}
tbody tr:nth-child(even){background:#111927}
@media(max-width:640px){header{margin-bottom:10px}.filters{padding:8px}.filters label:nth-child(2){flex:1 1 130px}.filters label:first-child{flex:1 1 155px}th,td{padding:8px 6px;font-size:.82rem}th:nth-child(1){width:40%}th:nth-child(2){width:26%}th:nth-child(3){width:34%}th.ancestor,td.ancestor{display:none}}
</style>
</head>
<body><main>
<header><div><a class="brand" href="./">Kappa Pi Beta</a><h1>Member table</h1></div>
<nav aria-label="Roster views"><a href="tree.html">Tree</a><a href="table.html" aria-current="page">Table</a></nav></header>
<div class="filters"><label>Search members<input id="query" type="search" placeholder="Name or line name" autocomplete="off"></label>
<label>School<select id="school"><option value="">All schools</option></select></label>
<p id="status" aria-live="polite"></p></div>
<table aria-label="Members and Big Brother connections"><thead><tr><th scope="col">Member</th><th scope="col">School</th><th scope="col">Big Brother</th><th scope="col" class="ancestor">Founder</th></tr></thead><tbody id="members"></tbody></table>
</main>
<script src="lineage-data.js"></script>
<script>
'use strict';
const query=document.getElementById('query');
const school=document.getElementById('school');
const members=document.getElementById('members');
const status=document.getElementById('status');
for(const [id,name] of campuses.entries()) school.add(new Option(name,id));
const sorted=records.map((_,id)=>id).sort((a,b)=>records[a][3].localeCompare(records[b][3]));
function addMember(cell,id,showLine=false){
  if(id===null){cell.textContent='Founder';return;}
  const link=document.createElement('a');
  link.href='tree.html?member='+id;
  link.textContent=records[id][3];
  cell.append(link);
  if(showLine){
    const line=document.createElement('small');
    line.textContent=records[id][0];
    cell.append(line);
  }
}
function drawMembers(){
  const term=normalizeMemberQuery(query.value);
  const filtered=sorted.filter(id=>(school.value===''||schoolIds[id]===Number(school.value))&&matchesMember(records[id],term));
  const body=document.createDocumentFragment();
  for(const id of filtered){
    const row=document.createElement('tr');
    addMember(row.insertCell(),id,true);
    row.insertCell().textContent=campuses[schoolIds[id]];
    addMember(row.insertCell(),records[id][1]);
    let founder=id;
    while(records[founder][1]!==null) founder=records[founder][1];
    const ancestry=row.insertCell();
    ancestry.className='ancestor';
    addMember(ancestry,founder);
    body.append(row);
  }
  members.replaceChildren(body);
  status.textContent=filtered.length===0?'No matching members':filtered.length+' of '+records.length+' members';
}
query.addEventListener('input',drawMembers);
school.addEventListener('change',drawMembers);
drawMembers();
</script>
</body></html>
