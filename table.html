<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta name="robots" content="noindex, nofollow, nosnippet">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kappa Pi Beta · Member Table</title>
<meta name="description" content="Browse Kappa Pi Beta members, their Big Brothers, kids, class dads and founder lines.">
<link rel="icon" href="assets/kpib-crest-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('kpib-theme');if(t==='dark')document.documentElement.dataset.theme='dark';}catch(e){}</script>
<link rel="stylesheet" href="kpib.css?v=68">
</head>
<body class="page-app page-table">
<a class="kp-skip" href="#roster">Skip to content</a>
<header class="kp-hdr"><div class="in">
<a class="kp-plate" href="./" aria-label="Kappa Pi Beta home"><img data-component="image" src="assets/kpib-lockup.png" alt="Kappa Pi Beta. Unity is the Beginning of Brotherhood." width="900" height="193"></a>
<nav class="kp-nav" data-component="nav" data-name="Main navigation" aria-label="Main"><a href="./">Home</a><a href="tree.html">Lineage tree</a><a href="table.html" aria-current="page">Member table</a></nav>
<div class="kp-tools"><button class="kp-ibtn" data-component="button" data-name="Theme" id="themeToggle" type="button">Dark</button>
<details class="kp-menu"><summary aria-expanded="false" aria-controls="mobileNav"><i data-icon="menu"></i>Menu</summary><nav id="mobileNav" class="kp-menu-list" data-component="nav" data-name="Mobile navigation" aria-label="Mobile"><a href="./">Home</a><a href="tree.html">Lineage tree</a><a href="table.html" aria-current="page">Member table</a></nav></details></div>
</div></header>
<main>
<div class="app-title"><h1>Member table</h1></div>
<div class="filters"><label>Search members<input id="query" data-component="input" type="search" placeholder="Name or line name" autocomplete="off"></label>
<div id="schools" class="school-filters" role="group" aria-label="Filter by school"></div>
<div class="filter-footer"><p id="status" data-state="empty" data-state-for="roster" aria-live="polite"></p>
<label class="mobile-sort">Sort<select id="mobileSort">
<option value="crossing:1">Oldest class first</option><option value="crossing:-1">Newest class first</option>
<option value="member:1">Member A to Z</option><option value="member:-1">Member Z to A</option>
<option value="school:1">School A to Z</option><option value="school:-1">School Z to A</option>
<option value="big:1">Big Brother A to Z</option><option value="big:-1">Big Brother Z to A</option>
<option value="kids:-1">Most kids first</option><option value="kids:1">Fewest kids first</option>
<option value="classDad:1">Class dad A to Z</option><option value="classDad:-1">Class dad Z to A</option>
<option value="lineage:1">Lineage A to Z</option><option value="lineage:-1">Lineage Z to A</option>
<option value="founder:1">Founder A to Z</option><option value="founder:-1">Founder Z to A</option>
</select></label><button type="button" id="filterToggle" class="filter-toggle" aria-expanded="false" aria-controls="schools"><i data-icon="sliders"></i><span>Filters</span><b id="filterCount" hidden></b></button></div></div>
<div class="table-scroll" tabindex="0" role="region" aria-label="Scrollable member table" id="roster-region">
<table class="kp-t" id="roster" data-component="table" data-dynamic data-states="empty" aria-label="Members and relationships"><thead><tr>
<th scope="col"><button type="button" data-sort="member">Member</button></th>
<th scope="col"><button type="button" data-sort="school">School</button></th>
<th scope="col" class="crossing" aria-sort="ascending"><button type="button" data-sort="crossing">Crossing</button></th>
<th scope="col"><button type="button" data-sort="big">Big Brother</button></th>
<th scope="col" class="kids"><button type="button" data-sort="kids" aria-description="Members of classes this member served as class dad for">Kids</button></th>
<th scope="col" class="class-dad"><button type="button" data-sort="classDad">Class dad</button></th>
<th scope="col" class="lineage"><button type="button" data-sort="lineage">Lineage</button></th>
<th scope="col" class="ancestor"><button type="button" data-sort="founder">Founder</button></th>
</tr></thead><tbody id="members"></tbody></table>
</div>
</main>
<script src="lineage-data.js?v=fa26c"></script>
<script src="class-dads.js?v=fa26b"></script>
<script src="relationships.js?v=1"></script>
<script src="state-machines.js?v=1"></script>
<script>
'use strict';
const query=document.getElementById('query');
const filterBox=document.querySelector('.filters');
const filterToggle=document.getElementById('filterToggle');
const filterCount=document.getElementById('filterCount');
const schoolFilters=document.getElementById('schools');
const rosterStateKey='kpib-roster-view';
const members=document.getElementById('members');
const tableScroll=document.querySelector('.table-scroll');
const status=document.getElementById('status');
const mobileSort=document.getElementById('mobileSort');
const schoolShortLabels=['NIU','UIC','Mizzou','UIUC','Purdue','Northwestern'];
const tableMachine=kpibMachines.createTableMachine({});
for(const [id,label] of [[null,'All schools'],...campuses.map((name,i)=>[i,schoolShortLabels[i]??name])]){
  const button=document.createElement('button');
  button.type='button';
  if(id===null) button.textContent=label;
  else{const dot=document.createElement('span');dot.className='school-dot d'+id;dot.setAttribute('aria-hidden','true');button.append(dot,label);}
  if(id!==null) button.setAttribute('aria-label',campuses[id]);
  button.setAttribute('aria-pressed',String(id===null));
  button.addEventListener('click',()=>tableMachine.send({type:'SET_SCHOOL',school:id}));
  schoolFilters.append(button);
}
const searchHaystack=records.map(r=>[r[0],r[3],...(memberAliases[r[3]]??[])].map(normalizeMemberQuery));
const lineageStart=records.map((_,id)=>{
  let start=id;
  for(let parent=records[start][1];parent!==null&&schoolIds[parent]===schoolIds[start];parent=records[start][1]) start=parent;
  return start;
});
const founders=records.map((_,id)=>{
  let founder=id;
  while(records[founder][1]!==null) founder=records[founder][1];
  return founder;
});
const semesterOrder={Winter:0,Spring:1,Summer:2,Fall:3};
function semesterKey(value){
  const [term,year]=value.split(' ');
  return Number(year)*4+(semesterOrder[term]??0);
}
const sortValues={
  member:id=>records[id][3],
  school:id=>campuses[schoolIds[id]],
  big:id=>records[records[id][1]]?.[3]??'',
  kids:id=>kidsByMember[id].length,
  classDad:id=>dadsByMember[id].join(', '),
  lineage:id=>records[lineageStart[id]][0],
  founder:id=>records[founders[id]][3],
};
const collator=new Intl.Collator(undefined,{sensitivity:'base',numeric:true});
function compareMembers(state,a,b){
  const order=state.sortColumn==='crossing'
    ? semesterKey(crossings[a][0])-semesterKey(crossings[b][0])||collator.compare(crossings[a][1],crossings[b][1])
    : state.sortColumn==='kids'
      ? sortValues.kids(a)-sortValues.kids(b)
      : collator.compare(sortValues[state.sortColumn](a),sortValues[state.sortColumn](b));
  return state.sortDirection*order||collator.compare(records[a][3],records[b][3]);
}
function addMember(cell,id,showLine=false){
  if(id===null){cell.textContent='Founder';return;}
  const link=document.createElement('a');
  link.href='tree.html?member='+id;
  link.textContent=records[id][3];
  cell.append(link);
  if(showLine){
    const line=document.createElement('small');
    line.textContent=records[id][0];
    cell.append(line);
  }
}
function addLineage(container,id){
  const link=document.createElement('a');
  link.href='tree.html?member='+id;
  link.textContent=records[id][0];
  link.title=records[id][3];
  container.append(link);
}
function addKids(container,id){
  const kids=kidsByMember[id];
  if(kids.length===0){container.textContent='0 kids';return;}
  const details=document.createElement('details');
  details.className='roster-kids';
  const summary=document.createElement('summary');
  summary.textContent=kids.length+(kids.length===1?' kid':' kids');
  const list=document.createElement('ul');
  for(const kid of kids){
    const item=document.createElement('li');
    addMember(item,kid);
    list.append(item);
  }
  details.append(summary,list);
  container.append(details);
}
function syncControls(state){
  const isOpen=state.drawer==='open';
  filterBox.classList.toggle('open',isOpen);
  filterToggle.setAttribute('aria-expanded',String(isOpen));
  Array.from(schoolFilters.children).forEach((button,index)=>button.setAttribute('aria-pressed',String(index===(state.school===null?0:state.school+1))));
  document.querySelector('th[aria-sort]')?.removeAttribute('aria-sort');
  document.querySelector('[data-sort="'+state.sortColumn+'"]').closest('th')
    .setAttribute('aria-sort',state.sortDirection===1?'ascending':'descending');
  const sortValue=state.sortColumn+':'+state.sortDirection;
  mobileSort.value=sortValue;
  const activeCount=(state.school!==null?1:0)+(sortValue!=='crossing:1'?1:0);
  filterCount.textContent=String(activeCount);
  filterCount.hidden=!activeCount;
}
function drawMembers(state){
  const term=normalizeMemberQuery(state.query);
  const filtered=records.map((_,id)=>id).filter(id=>(state.school===null||schoolIds[id]===state.school)&&(!term||searchHaystack[id].some(v=>v.includes(term)))).sort((a,b)=>compareMembers(state,a,b));
  const body=document.createDocumentFragment();
  for(const id of filtered){
    const row=document.createElement('tr');
    const memberCell=row.insertCell();
    addMember(memberCell,id,true);
    const [semester,cohort]=crossings[id];
    const start=lineageStart[id];
    const schoolCell=row.insertCell(),schoolDot=document.createElement('span');
    schoolCell.setAttribute('data-label','School');
    schoolDot.className='school-dot d'+schoolIds[id];schoolDot.setAttribute('aria-hidden','true');
    const schoolVal=document.createElement('span');schoolVal.className='cell-val';schoolVal.append(schoolDot,campuses[schoolIds[id]]);
    schoolCell.append(schoolVal);
    const crossing=row.insertCell();
    crossing.className='crossing';
    crossing.setAttribute('data-label','Crossing');
    const crossingVal=document.createElement('span');crossingVal.className='cell-val';
    crossingVal.textContent=semester;
    const classLabel=document.createElement('small');
    classLabel.textContent=cohort;
    crossingVal.append(classLabel);
    crossing.append(crossingVal);
    const big=row.insertCell();
    big.setAttribute('data-label','Big Brother');
    addMember(big,records[id][1]);
    const dadNames=dadsByMember[id];
    const dadText=dadNames.join(', ');
    const kids=row.insertCell();
    kids.className='kids';
    kids.setAttribute('data-label','Kids');
    addKids(kids,id);
    const classDad=row.insertCell();
    classDad.className='class-dad';
    classDad.setAttribute('data-label','Class dad');
    classDad.textContent=dadText||'None listed';
    const lineage=row.insertCell();
    lineage.className='lineage';
    lineage.setAttribute('data-label','Lineage');
    addLineage(lineage,start);
    const ancestry=row.insertCell();
    ancestry.className='ancestor';
    ancestry.setAttribute('data-label','Founder');
    addMember(ancestry,founders[id]);
    body.append(row);
  }
  members.replaceChildren(body);
  tableScroll.scrollTop=0;
  status.dataset.state=filtered.length?'ready':'empty';
  status.textContent=filtered.length===0?'No matches. Try another name or school.':filtered.length===records.length?records.length+' members':filtered.length+' of '+records.length+' members';
}
tableMachine.subscribe((state,event)=>{
  syncControls(state);
  if(event.type!=='TOGGLE_DRAWER') drawMembers(state);
});
for(const button of document.querySelectorAll('[data-sort]')){
  button.addEventListener('click',()=>tableMachine.send({type:'TOGGLE_SORT',column:button.dataset.sort}));
}
mobileSort.addEventListener('change',()=>{
  const [column,direction]=mobileSort.value.split(':');
  tableMachine.send({type:'SET_SORT',column,direction:Number(direction)});
});
filterToggle.addEventListener('click',()=>tableMachine.send({type:'TOGGLE_DRAWER'}));
query.addEventListener('input',()=>tableMachine.send({type:'SET_QUERY',query:query.value}));
function rememberRoster(){
  const state=tableMachine.getState();
  try{
    sessionStorage.setItem(rosterStateKey,JSON.stringify({query:state.query,school:state.school,column:state.sortColumn,direction:state.sortDirection,scroll:tableScroll.scrollTop}));
  }catch{}
}
function restoreRoster(){
  let previous;
  try{previous=JSON.parse(sessionStorage.getItem(rosterStateKey));}catch{}
  if(!previous||typeof previous.query!=='string'){
    const initial=tableMachine.getState();
    syncControls(initial);
    drawMembers(initial);
    return;
  }
  query.value=previous.query;
  const school=Number.isInteger(previous.school)&&previous.school>=0&&previous.school<campuses.length?previous.school:null;
  const sortColumn=previous.column==='crossing'||Object.hasOwn(sortValues,previous.column)?previous.column:'crossing';
  const sortDirection=previous.direction===-1?-1:1;
  tableMachine.send({type:'RESTORE',query:previous.query,school,sortColumn,sortDirection});
  if(Number.isFinite(previous.scroll)) tableScroll.scrollTop=previous.scroll;
}
document.addEventListener('click',event=>{if(event.target.closest('a[href^="tree.html"]')) rememberRoster();});
restoreRoster();
</script>
<script src="icons.js?v=2"></script>
<script src="kpib.js?v=7"></script>
</body></html>
