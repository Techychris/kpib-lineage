  d3.tree().nodeSize(spacing)(hierarchy);
  const nodes=hierarchy.descendants();
  const minBreadth=d3.min(nodes,d=>d.x);
  for(const node of nodes){
    const breadth=node.x-minBreadth+18;
    node.left=vertical?breadth:node.y+18;
    node.centerY=(vertical?node.y+18:breadth)+NODE_HEIGHT/2;
  }
  return nodes;
}
function connectionPoints({source,target},vertical){
  return vertical
    ? {source:{x:source.left+NODE_WIDTH/2,y:source.centerY+NODE_HEIGHT/2},target:{x:target.left+NODE_WIDTH/2,y:target.centerY-NODE_HEIGHT/2}}
    : {source:{x:source.left+NODE_WIDTH,y:source.centerY},target:{x:target.left,y:target.centerY}};
}
function draw(){
  const focused=selected!==null&&!full;
  const path=selected===null?[]:founderPath(selected);
  const nextOnPath=new Map(path.slice(0,-1).map((id,i)=>[id,path[i+1]]));
  const ancestry=new Set(path);
  const hierarchy=d3.hierarchy(branch,id=>{
    if(id===OVERVIEW) return rootIds;
    if(id===UNRESOLVED) return floating;
    if(!focused||id===selected) return children[id];
    return nextOnPath.has(id)?[nextOnPath.get(id)]:[];
  });
  const vertical=orientation.value==='vertical';
  const nodes=positionTree(hierarchy,vertical,branch===OVERVIEW);
  dimensions=[d3.max(nodes,d=>d.left)+NODE_WIDTH+18,d3.max(nodes,d=>d.centerY)+NODE_HEIGHT/2+18];
  const links=hierarchy.links();
  const isCross=({source,target})=>source.data>=0&&schoolOf(source.data)!==schoolOf(target.data);
  const isPath=({source,target})=>ancestry.has(source.data)&&ancestry.has(target.data);
  const connector=(vertical?d3.linkVertical():d3.linkHorizontal()).x(p=>p.x).y(p=>p.y);
  const labelX=d=>{
    const points=connectionPoints(d,vertical);
    return (points.source.x+points.target.x)/2+(vertical?9:0);
  };
  const labelY=d=>{
    const points=connectionPoints(d,vertical);
    return (points.source.y+points.target.y)/2-7;
  };
  scene.selectAll('.edge').data(links,d=>d.target.data).join('path')
    .attr('class',d=>'edge'+(isCross(d)?' cross-school':'')+(isPath(d)?' ancestry':''))
    .attr('d',d=>connector(connectionPoints(d,vertical)))
    .lower();
  const labels=scene.selectAll('.link-name').data(
    focused?links.filter(d=>d.source.data>=0):links.filter(isCross),d=>d.target.data
  ).join(enter=>{const label=enter.append('text').attr('class','link-name').attr('text-anchor','middle');label.append('tspan').attr('class','connector-name');label.append('tspan').attr('class','transition').attr('dy',14);return label;})
    .attr('x',labelX).attr('y',labelY).attr('text-anchor',vertical?'start':'middle');
  labels.select('.connector-name').text(d=>records[d.source.data][3]);
  labels.select('.transition').attr('x',labelX)
    .text(d=>isCross(d)?schoolOf(d.target.data):'');
  const cards=scene.selectAll('.node').data(nodes,d=>d.data).join(enter=>{
    const item=enter.append('g').attr('class','node');
    item.append('title');
    item.append('rect').attr('width',NODE_WIDTH).attr('height',NODE_HEIGHT).attr('y',-NODE_HEIGHT/2).attr('rx',9);
    item.append('text').attr('class','name').attr('x',12).attr('y',-11);
    item.append('text').attr('class','member-name').attr('x',12).attr('y',6);
    item.append('text').attr('class','school').attr('x',12).attr('y',23);
    return item;
  }).attr('transform',d=>'translate('+d.left+','+d.centerY+')')
    .attr('class',d=>'node'+(d.data===branch?' root':'')+(d.data===selected?' selected':'')+(ancestry.has(d.data)?' on-path':''))
    .attr('tabindex',d=>d.data>=0?0:null).attr('role',d=>d.data>=0?'button':null)
    .attr('aria-label',d=>names(d.data).filter(Boolean).join(' · '))
    .on('click',(event,d)=>{if(!event.defaultPrevented&&d.data>=0) mark(d.data,true);})
    .on('keydown',(event,d)=>{if(d.data>=0&&(event.key==='Enter'||event.key===' ')){event.preventDefault();mark(d.data,true);}});
  cards.select('title').text(d=>[...names(d.data),schoolOf(d.data)].filter(Boolean).join(' · '));
  const short=(value,length)=>value.length>length?value.slice(0,length-1)+'…':value;
  cards.select('.name').text(d=>short(names(d.data)[0],23));
  cards.select('.member-name').text(d=>short(names(d.data)[1],29));
  cards.select('.school').text(d=>schoolOf(d.data)??'');
  nodesById.clear();
  cards.each(function(d){nodesById.set(d.data,{element:this,x:d.left+NODE_WIDTH/2,y:d.centerY});});
}
function fit(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  const scale=Math.max(.002,Math.min(1,(w-24)/dimensions[0],(h-24)/dimensions[1]));
  drawing.call(zoom.transform,d3.zoomIdentity.translate((w-dimensions[0]*scale)/2,(h-dimensions[1]*scale)/2).scale(scale));
}
function describe(){
  const choosing=branch===FOUNDERS;
  founderList.hidden=!choosing;
  canvas.hidden=choosing;
  document.querySelector('.diagram-key').hidden=choosing;
  document.querySelector('.zoom-controls').hidden=choosing;
  member.hidden=selected===null;
  pick('overview').hidden=choosing||(!phone.matches&&branch===OVERVIEW);
  pick('overview').textContent=phone.matches?'All founders':'Full organization';
  if(selected===null){
    caption.textContent=choosing?'Select a founder or search for a member.':'Full organization. Search or choose a branch to read names.';
    return;
  }
  const [line,parent,,actual]=records[selected];
  pick('memberName').textContent=actual;
  const count=children[selected].length;
  pick('memberMeta').textContent=line+' · '+schoolOf(selected)+' · '+count+' direct '+(count===1?'connection':'connections');
  parentButton.hidden=parent===null;
  parentButton.textContent=parent===null?'':'Big Brother · '+records[parent][3];
  modeButton.textContent=full?'Focus on member':'Full branch';
  caption.textContent=full?'Full founder branch. Drag to pan. Pinch or use the zoom controls.':'Showing the path to the founder and this member’s direct connections. Drag to pan. Pinch or use the zoom controls.';
}
function focusNode(id,moveFocus=false){
  const node=nodesById.get(id);
  if(!node) return;
  drawing.call(zoom.transform,d3.zoomIdentity.translate(canvas.clientWidth/2-node.x,canvas.clientHeight/2-node.y));
  if(moveFocus) node.element.focus({preventScroll:true});
}
function show(id){
  if(id>=0){full=false;mark(id,false);return;}
  branch=id;selected=null;full=false;select.value=String(id);
  query.value='';matches.replaceChildren();
  describe();
  if(branch!==FOUNDERS){draw();fit();}
}
function mark(id,moveFocus){
  const target=rootOf(id);
  if(target!==branch) full=false;
  branch=target;selected=id;select.value=String(branch);
  matches.replaceChildren();
  describe();draw();focusNode(id,moveFocus);
}
select.addEventListener('change',()=>{closeView();show(Number(select.value));});
orientation.addEventListener('change',()=>{
  closeView();
  if(branch===FOUNDERS) return;
  draw();
  if(selected===null) fit();
  else focusNode(selected);
});
parentButton.addEventListener('click',()=>mark(records[selected][1],true));
modeButton.addEventListener('click',()=>{full=!full;draw();describe();focusNode(selected);});
pick('zoomOut').addEventListener('click',()=>drawing.call(zoom.scaleBy,.8));
pick('zoomIn').addEventListener('click',()=>drawing.call(zoom.scaleBy,1.25));
pick('fit').addEventListener('click',fit);
canvas.addEventListener('keydown',event=>{
  if(event.target!==canvas) return;
  const direction={ArrowLeft:[1,0],ArrowRight:[-1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[event.key];
  if(!direction) return;
  event.preventDefault();
  const step=48/d3.zoomTransform(svg).k;
  drawing.call(zoom.translateBy,direction[0]*step,direction[1]*step);
});
pick('overview').addEventListener('click',()=>{closeView();show(phone.matches?FOUNDERS:OVERVIEW);query.focus();});
query.addEventListener('input',()=>matches.replaceChildren());
query.addEventListener('keydown',event=>{if(event.key==='Escape') matches.replaceChildren();});
pick('find').addEventListener('submit',event=>{
  event.preventDefault();
  const normalize=value=>value.normalize('NFD').replace(/\p{M}/gu,'').toLocaleLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
  closeView();
  const term=normalize(query.value);
  matches.replaceChildren();
  if(!term)return;
  const found=records.map(([name,,,actual],id)=>({name,actual,id})).filter(({name,actual})=>normalize(name).includes(term)||normalize(actual).includes(term)||(actual==='Jose Anaya'&&'jose reyes'.includes(term))||(actual==='Jesmer Dionela'&&'jazz dionela'.includes(term)));
  if(found.length===1){mark(found[0].id,true);return;}
  const label=document.createElement('span');
  label.textContent=found.length?found.length+' matches'+(found.length>16?' · Refine your search to see more.':''):'No matching names.';
  matches.append(label);
  for(const {name,id} of found.slice(0,16)){
    const result=document.createElement('button');result.type='button';
    const actual=document.createElement('strong');actual.textContent=records[id][3];
    const line=document.createElement('span');line.textContent=name;
    result.append(actual,line);
    result.addEventListener('click',()=>mark(id,true));matches.append(result);
  }
});
show(phone.matches?FOUNDERS:OVERVIEW);
new ResizeObserver(()=>{if(branch===OVERVIEW) fit();}).observe(canvas);
</script></body></html>
