<!doctype html>

<head>
<meta name="robots" content="noindex, nofollow, nosnippet">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Explore Kappa Pi Beta founder branches by Big Brother or class dad across schools using line names.">
<link rel="icon" href="assets/kpib-crest-192.png">

<body class="page-app">

<nav class="kp-nav" data-component="nav" data-name="Main navigation" aria-label="Main"><a href="./">Home</a><a href="tree.html" aria-current="page">Lineage tree</a><a href="table.html">Member table</a></nav>

<div class="app-title"><h1>Lineage tree</h1><p class="stats"><span><b id="statMembers">621</b> members</span></p></div>

<form class="search" id="find"><label>Member name<input id="query" data-component="input" type="search" placeholder="Name or line" autocomplete="off"></label><button data-component="button" data-name="Search" aria-label="Search"><i data-icon="search"></i><span class="lbl">Search</span></button></form>

<div class="zoom-controls" role="group" aria-label="Diagram zoom"><button type="button" id="zoomOut" aria-label="Zoom out"><i data-icon="minus"></i></button><output id="zoom" aria-live="off">100%</output><button type="button" id="zoomIn" aria-label="Zoom in"><i data-icon="plus"></i></button><button type="button" id="fit"><i data-icon="fit"></i>Fit diagram</button></div>

<button type="button" id="parent" hidden></button><label class="toggle"><input type="checkbox" id="mode" checked><span>Show downstream</span></label><label class="toggle"><input type="checkbox" id="depth"><span>Full depth</span></label>
</div>

</div>
</div>

<div id="generations" hidden></div>

<dialog id="connectionsPanel" aria-labelledby="connectionsTitle">
  <div class="connections-head"><h2 id="connectionsTitle">Connections</h2><form method="dialog"><button autofocus>Close</button></form></div>
  <p id="connectionsMeta"></p>
  <div id="connectionsBody"></div>
</dialog>
<div class="diagram-key" aria-label="Diagram key"><span><i></i>Same-school link</span><span><i class="change"></i>School change</span><span><i class="ancestry"></i>Path to founder</span><ul class="school-key" data-school-key aria-label="School colors"></ul></div>
</section></main>
<script src="d3.min.js"></script>
<script src="icons.js?v=2"></script>
<script src="lineage-data.js?v=fa26d"></script>
<script src="class-dads.js?v=fa26c"></script>
<script src="relationships.js?v=1"></script>
<script src="state-machines.js?v=1"></script>
<script>
'use strict';
const NODE_WIDTH=206, NODE_HEIGHT=104;
const OVERVIEW=-1, UNRESOLVED=-2, FOUNDERS=-3;
const schoolOf=id=>campuses[schoolIds[id]];
const rootIds=[], floating=[];
const children=records.map(()=>[]);
const parentOf=records.map(()=>null);
const nodesById=new Map();
const pick=id=>document.getElementById(id);
const select=pick('branch'), canvas=pick('canvas'), svg=canvas.querySelector('svg');
const caption=pick('caption'), matches=pick('matches'), query=pick('query');
const founderList=pick('founderList'), connectionsButton=pick('connections'), connectionsPanel=pick('connectionsPanel');
const viewToggle=pick('viewToggle'), memberPanel=pick('member'), viewControls=pick('viewControls'), desktopMember=pick('desktopMember');
const orientation=pick('orientation'), lineageSelect=pick('lineage'), parentButton=pick('parent'), modeButton=pick('mode');

document.getElementById('statMembers').textContent=records.length;
const desktopQuery=matchMedia('(min-width:701px) and (min-height:521px) and (pointer:fine),(min-width:740px) and (min-height:580px)');
let initialLineage='big', initialDepth='auto';
try{if(localStorage.getItem('kpib-lineage')==='dad') initialLineage='dad';}catch(e){}
try{if(localStorage.getItem('kpib-depth')==='full') initialDepth='full';}catch(e){}

const treeMachine=kpibMachines.createTreeMachine({
  isPhone:!desktopQuery.matches,
  lineageMode:initialLineage,
  depthMode:initialDepth,
});

function buildLineage(mode){
  rootIds.length=0;floating.length=0;
  children.forEach(list=>{list.length=0;});
  records.forEach(([,bigBrother,founder],id)=>{
    const parent=mode==='big'?bigBrother:classDadByMember[id];
    parentOf[id]=parent;
    if(parent!==null) children[parent].push(id);
    else if(founder) rootIds.push(id);
    else floating.push(id);
  });
}
buildLineage(treeMachine.getState().lineageMode);

const dadWord=mode=>mode==='big'?'Big Brother':'Class dad';
const kidsOf=(id,mode)=>mode==='big'?children[id]:kidsByMember[id];
const selectedOf=view=>view.type==='member-tree'||view.type==='member-generations'?view.memberId:null;
const branchValueOf=view=>view.type==='founders'?FOUNDERS:view.type==='overview'?OVERVIEW:view.type==='unresolved'?UNRESOLVED:view.branchRoot;

function syncBranchOptions(isPhone){
  select.replaceChildren();
  select.add(new Option(isPhone?'Choose a founder':'Full organization',isPhone?FOUNDERS:OVERVIEW));
  for(const id of rootIds) select.add(new Option(records[id][0]+' · '+records[id][3],id));
  if(floating.length) select.add(new Option('Binder-only branches',UNRESOLVED));
}
function syncChrome(state){
  viewToggle.hidden=!state.isPhone;
  if(state.isPhone) viewControls.insertBefore(memberPanel,viewControls.querySelector('.menu-key'));
  else desktopMember.append(memberPanel);
  viewToggle.setAttribute('aria-expanded',String(state.popover==='open'));
  lineageSelect.value=state.lineageMode;
  orientation.value=state.orientation;
  select.value=String(branchValueOf(state.view));
}

for(const id of rootIds){
  const card=document.createElement('button');
  card.type='button';
  const line=document.createElement('strong');line.textContent=records[id][0];
  const name=document.createElement('span');name.textContent=records[id][3];
  card.append(line,name);
  card.addEventListener('click',()=>selectMember(id,true));
  founderList.append(card);
}
document.querySelectorAll('[data-school-key]').forEach(list=>campuses.forEach((name,index)=>{
  const item=document.createElement('li'),dot=document.createElement('span');
  dot.className='school-dot d'+index;dot.setAttribute('aria-hidden','true');
  item.append(dot,name);list.append(item);
}));

let lastDepth=5, drawnDepth=5, dimensions=[0,0], rootPoint=null;
function defaultDepth(state){
  const vertical=state.orientation==='vertical';
  const extent=vertical?canvas.clientHeight:canvas.clientWidth;
  if(!extent) return lastDepth;
  const step=vertical?185:(state.isPhone?NODE_WIDTH+44:400);
  lastDepth=Math.max(3,Math.min(7,Math.round(extent/(step*0.4))));
  return lastDepth;
}

const drawing=d3.select(svg);
const scene=drawing.append('g');
const zoom=d3.zoom().scaleExtent([0.002,3]).extent(()=>[[0,0],[canvas.clientWidth,canvas.clientHeight]])
  .filter(event=>!event.button&&(event.type!=='mousedown'||!event.target.closest('.node')))
  .on('zoom',event=>{scene.attr('transform',event.transform);pick('zoom').textContent=Math.round(event.transform.k*100)+'%';});
drawing.call(zoom).on('dblclick.zoom',null);

const names=id=>id===OVERVIEW?['Kappa Pi Beta','']:id===UNRESOLVED?['Unmatched branches','']:[records[id][0],records[id][3]];
function rootOf(id){
  while(parentOf[id]!==null) id=parentOf[id];
  return records[id][2]?id:UNRESOLVED;
}
function founderPath(id){
  const path=[];
  for(let m=id;m!==null;m=parentOf[m]) path.push(m);
  return path.reverse();
}
function positionTree(hierarchy,vertical,overview,isPhone){
  const spacing=vertical?[NODE_WIDTH+30,185]:[125,overview?260:isPhone?NODE_WIDTH+44:400];
  d3.tree().nodeSize(spacing)(hierarchy);
  const nodes=hierarchy.descendants();
  const minBreadth=d3.min(nodes,d=>d.x);
  for(const node of nodes){
    const breadth=node.x-minBreadth+18;
    node.left=vertical?breadth:node.y+18;
    node.centerY=(vertical?node.y+18:breadth)+NODE_HEIGHT/2;
  }
  return nodes;
}
function connectionPoints({source,target},vertical){
  return vertical
    ? {source:{x:source.left+NODE_WIDTH/2,y:source.centerY+NODE_HEIGHT/2},target:{x:target.left+NODE_WIDTH/2,y:target.centerY-NODE_HEIGHT/2}}
    : {source:{x:source.left+NODE_WIDTH,y:source.centerY},target:{x:target.left,y:target.centerY}};
}
function draw(state){
  const view=state.view;
  const selected=selectedOf(view);
  const focused=view.type==='member-tree'&&view.scope==='downstream';
  const path=selected===null?[]:founderPath(selected);
  const ancestry=new Set(path);
  const rootId=focused?selected:branchValueOf(view);
  const baseDepth=state.depthMode==='full'?Infinity:defaultDepth(state);
  const depthLimit=view.type==='member-tree'&&view.scope==='branch'?Math.max(baseDepth,path.length):baseDepth;
  const depthOf=new Map([[rootId,0]]);
  const hidden=new Map();
  const kidsFor=id=>focused&&id===selected?kidsOf(id,state.lineageMode):children[id];
  const below=id=>kidsFor(id).reduce((sum,kid)=>sum+1+below(kid),0);
  drawnDepth=baseDepth;
  const hierarchy=d3.hierarchy(rootId,id=>{
    if(id===OVERVIEW){for(const r of rootIds) depthOf.set(r,1);return rootIds;}
    if(id===UNRESOLVED){for(const f of floating) depthOf.set(f,1);return floating;}
    const depth=depthOf.get(id);
    const list=kidsFor(id);
    if(depth>=depthLimit){if(list.length) hidden.set(id,below(id));return null;}
    for(const kid of list) depthOf.set(kid,depth+1);
    return list;
  });
  const vertical=state.orientation==='vertical';
  const nodes=positionTree(hierarchy,vertical,view.type==='overview',state.isPhone);
  rootPoint={x:nodes[0].left+NODE_WIDTH/2,y:nodes[0].centerY,vertical};
  dimensions=[d3.max(nodes,d=>d.left)+NODE_WIDTH+18,d3.max(nodes,d=>d.centerY)+NODE_HEIGHT/2+18];
  const links=hierarchy.links();
  const isCross=({source,target})=>source.data>=0&&schoolOf(source.data)!==schoolOf(target.data);
  const isPath=({source,target})=>ancestry.has(source.data)&&ancestry.has(target.data);
  const connector=(vertical?d3.linkVertical():d3.linkHorizontal()).x(p=>p.x).y(p=>p.y);
  const labelX=d=>{const p=connectionPoints(d,vertical);return (p.source.x+p.target.x)/2+(vertical?9:0);};
  const labelY=d=>{const p=connectionPoints(d,vertical);return (p.source.y+p.target.y)/2-7;};
  scene.selectAll('.edge').data(links,d=>d.target.data).join('path')
    .attr('class',d=>'edge'+(isCross(d)?' cross-school':'')+(isPath(d)?' ancestry':''))
    .attr('d',d=>connector(connectionPoints(d,vertical)))
    .lower();
  const labels=scene.selectAll('.link-name').data(
    focused?(state.isPhone&&!vertical?links.filter(isCross):links.filter(d=>d.source.data>=0)):links.filter(isCross),d=>d.target.data
  ).join(enter=>{const label=enter.append('text').attr('class','link-name').attr('text-anchor','middle');label.append('tspan').attr('class','connector-name');label.append('tspan').attr('class','transition').attr('dy',14);return label;})
    .attr('x',labelX).attr('y',labelY).attr('text-anchor',vertical?'start':'middle');
  labels.select('.connector-name').text(d=>records[d.source.data][3]);
  labels.select('.transition').attr('x',labelX).text(d=>isCross(d)?schoolOf(d.target.data):'');
  const cards=scene.selectAll('.node').data(nodes,d=>d.data).join(enter=>{
    const item=enter.append('g').attr('class','node');
    item.append('title');
    item.append('rect').attr('width',NODE_WIDTH).attr('height',NODE_HEIGHT).attr('y',-NODE_HEIGHT/2).attr('rx',12);
    item.append('rect').attr('class','school-bar').attr('x',10).attr('y',-NODE_HEIGHT/2+12).attr('width',4).attr('height',NODE_HEIGHT-24).attr('rx',2);
    item.append('text').attr('class','name').attr('x',24).attr('y',-29);
    const badge=item.append('g').attr('class','more-badge');
    badge.append('rect').attr('class','more-pill').attr('x',NODE_WIDTH-80).attr('y',-NODE_HEIGHT/2+8).attr('width',68).attr('height',32).attr('rx',16);
    badge.append('text').attr('class','more').attr('x',NODE_WIDTH-46).attr('y',-NODE_HEIGHT/2+31).attr('text-anchor','middle');
    item.append('text').attr('class','member-name').attr('x',24).attr('y',-12);
    item.append('text').attr('class','school').attr('x',24).attr('y',5);
    item.append('text').attr('class','school semester').attr('x',24).attr('y',22);
    item.append('text').attr('class','school cohort').attr('x',24).attr('y',39);
    return item;
  }).attr('transform',d=>'translate('+d.left+','+d.centerY+')')
    .attr('class',d=>'node'+(d.data===rootId?' root':'')+(d.data===selected?' selected':'')+(ancestry.has(d.data)?' on-path':''))
    .attr('tabindex',d=>d.data>=0?0:null).attr('role',d=>d.data>=0?'button':null)
    .attr('aria-label',d=>[...names(d.data),...(crossings[d.data]??[])].filter(Boolean).join(' · '))
    .on('click',(event,d)=>{if(!event.defaultPrevented&&d.data>=0) selectMember(d.data,true);})
    .on('keydown',(event,d)=>{if(d.data>=0&&(event.key==='Enter'||event.key===' ')){event.preventDefault();selectMember(d.data,true);}});
  cards.select('.school-bar').attr('class',d=>'school-bar '+(d.data>=0?'s'+schoolIds[d.data]:'sx'));
  cards.select('title').text(d=>[...names(d.data),schoolOf(d.data),...(crossings[d.data]??[]),hidden.has(d.data)?hidden.get(d.data)+' more below. Click to open.':''].filter(Boolean).join(' · '));
  const short=(value,length)=>value.length>length?value.slice(0,length-1)+'…':value;
  cards.select('.name').text(d=>short(names(d.data)[0],hidden.has(d.data)?10:19));
  cards.select('.more').text(d=>hidden.has(d.data)?'+'+hidden.get(d.data):'');
  cards.select('.more-badge').attr('display',d=>hidden.has(d.data)?null:'none');
  const depthNote=pick('depthNote');depthNote.hidden=!hidden.size;
  depthNote.textContent='Showing '+lastDepth+' generations. A +N on a card means more members below it. Turn on Full depth to see everything.';
  cards.select('.member-name').text(d=>short(names(d.data)[1],25));
  cards.select('.school').text(d=>schoolOf(d.data)??'');
  cards.select('.semester').text(d=>crossings[d.data]?.[0]??'');
  cards.select('.cohort').text(d=>short(crossings[d.data]?.[1]??'',25));
  nodesById.clear();
  cards.each(function(d){nodesById.set(d.data,{element:this,x:d.left+NODE_WIDTH/2,y:d.centerY});});
}
function fit(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(!w||!h) return;
  const fitted=Math.max(.002,Math.min(1,(w-24)/dimensions[0],(h-24)/dimensions[1]));
  const readable=treeMachine.getState().isPhone&&fitted>=.25;
  const scale=readable?Math.max(fitted,.72):fitted;
  let x=(w-dimensions[0]*scale)/2,y=(h-dimensions[1]*scale)/2;
  if(readable&&rootPoint){
    if(dimensions[0]*scale>w-24) x=rootPoint.vertical?w/2-rootPoint.x*scale:16;
    if(dimensions[1]*scale>h-24) y=rootPoint.vertical?16:h/2-rootPoint.y*scale;
    else if(rootPoint.vertical) y=16;
  }
  drawing.call(zoom.transform,d3.zoomIdentity.translate(x,y).scale(scale));
}
const generationName=(n,mode)=>(mode==='big'?['Littles','Grand-littles','Great-grand-littles']:['Kids','Grandkids','Great-grandkids','Great-great-grandkids'])[n]??'Generation '+(n+1);
function renderGenerations(state){
  const selected=state.view.memberId;
  const mode=state.lineageMode;
  const box=pick('generations');
  box.replaceChildren();
  const levels=[],seen=new Set([selected]);
  let row=kidsOf(selected,mode).filter(id=>!seen.has(id));
  while(row.length){
    row.forEach(id=>seen.add(id));
    levels.push(row);
    row=[...new Set(row.flatMap(id=>kidsOf(id,mode)))].filter(id=>!seen.has(id));
  }
  const total=levels.reduce((sum,level)=>sum+level.length,0);
  const heading=document.createElement('h2');
  heading.textContent=records[selected][3]+(total?' · '+total+(total===1?' descendant':' descendants')+' in '+levels.length+(levels.length===1?' generation':' generations'):' · none recorded');
  box.append(heading);
  levels.forEach((ids,index)=>{
    const group=document.createElement('details');
    group.open=index<2;
    const title=document.createElement('summary');
    title.textContent=generationName(index,mode)+' · '+ids.length;
    group.append(title);
    const list=document.createElement('ul');
    for(const id of ids){
      const item=document.createElement('li'),button=document.createElement('button');
      button.type='button';
      const line=document.createElement('strong');line.textContent=records[id][0];
      const real=document.createElement('span');real.textContent=records[id][3];
      const meta=document.createElement('span'),dot=document.createElement('i');
      dot.className='school-dot d'+schoolIds[id];dot.setAttribute('aria-hidden','true');
      meta.append(dot,[schoolOf(id),crossings[id][0],index>0?(mode==='big'?'Big Brother: '+records[parentOf[id]][0]:dadsByMember[id].length?'Class dad: '+dadsByMember[id].join(', '):''):''].filter(Boolean).join(' · '));
      button.append(line,real,meta);
      button.addEventListener('click',()=>selectMember(id,false));
      item.append(button);list.append(item);
    }
    group.append(list);box.append(group);
  });
  box.scrollTop=0;
}
function describe(state){
  const view=state.view;
  const choosing=view.type==='founders';
  const showList=view.type==='member-generations';
  const selected=selectedOf(view);
  document.body.classList.toggle('diagram-open',!choosing);
  founderList.hidden=!choosing;
  canvas.hidden=choosing||showList;
  pick('generations').hidden=!showList;
  document.querySelector('.diagram-key').hidden=choosing||showList;
  document.querySelector('.zoom-controls').hidden=choosing||showList;
  document.querySelectorAll('.toggle').forEach(el=>{el.hidden=showList;});
  pick('viewTree').setAttribute('aria-pressed',String(!showList));
  pick('viewList').setAttribute('aria-pressed',String(showList));
  memberPanel.hidden=selected===null;
  connectionsButton.hidden=selected===null;
  pick('overview').hidden=choosing||(!state.isPhone&&view.type==='overview');
  pick('overview').innerHTML=kpibIcon('users')+(state.isPhone?'All founders':'Full organization');
  if(selected===null){
    caption.textContent=choosing?'Select a founder or search for a member.':'Full organization. Search or choose a branch to read names.';
    return;
  }
  const [line,,,actual]=records[selected];
  const parent=parentOf[selected];
  pick('memberName').textContent=actual;
  const count=kidsOf(selected,state.lineageMode).length;
  pick('memberMeta').textContent=line+' · '+schoolOf(selected)+' · '+crossings[selected].join(' · ')+' · '+count+' '+(state.lineageMode==='big'?(count===1?'little':'littles'):(count===1?'kid':'kids'));
  parentButton.hidden=parent===null;
  parentButton.replaceChildren();
  if(parent!==null){parentButton.insertAdjacentHTML('afterbegin',kpibIcon('up'));parentButton.append(dadWord(state.lineageMode)+' · '+records[parent][3]);}
  modeButton.checked=view.scope==='downstream';
  pick('depth').checked=state.depthMode==='full';
  if(showList){
    pick('depthNote').hidden=true;
    renderGenerations(state);
    caption.textContent=state.lineageMode==='big'
      ?'A Big Brother\'s littles are the next generation. Tap a member to see their littles.'
      :'A class dad\'s class is his kids, and their classes are the next generation. Tap a member to see their kids.';
    return;
  }
  caption.textContent=view.scope==='branch'?'Full founder branch, with the path to the founder highlighted. Drag to pan. Pinch or use the zoom controls.':'Showing this member and everyone downstream of them. Use '+dadWord(state.lineageMode)+' to move up a level. Drag to pan. Pinch or use the zoom controls.';
}
function renderConnections(state){
  const id=selectedOf(state.view);
  const [line,,,name]=records[id];
  pick('connectionsTitle').textContent=name;
  pick('connectionsMeta').textContent=[line,schoolOf(id),...crossings[id]].join(' · ');
  const content=pick('connectionsBody');
  content.replaceChildren();
  function addGroup(title,ids,ordered,empty){
    const heading=document.createElement('h3');heading.textContent=title;content.append(heading);
    if(!ids.length){const message=document.createElement('p');message.textContent=empty;content.append(message);return;}
    const list=document.createElement(ordered?'ol':'ul');
    for(const relation of ids){
      const item=document.createElement('li'),link=document.createElement('button');
      link.type='button';link.textContent=records[relation][3];
      const detail=document.createElement('small');detail.textContent=records[relation][0]+' · '+schoolOf(relation);
      link.append(detail);
      link.addEventListener('click',()=>{connectionsPanel.close();selectMember(relation,true);});
      item.append(link);list.append(item);
    }
    content.append(list);
  }
  addGroup(state.lineageMode==='big'?'Littles':'Kids',kidsOf(id,state.lineageMode),false,'None recorded.');
  const ancestry=founderPath(id).reverse().slice(1);
  if(state.lineageMode==='dad'&&classDadIdsByMember[id].length>1) addGroup('Class dads',classDadIdsByMember[id],false,'');
  addGroup('Path back to the founder',ancestry,true,'This member is a founder.');
  connectionsPanel.showModal();
}
function focusNode(id,moveFocus=false){
  const node=nodesById.get(id);
  if(!node) return;
  drawing.call(zoom.transform,d3.zoomIdentity.translate(canvas.clientWidth/2-node.x,canvas.clientHeight/2-node.y));
  if(moveFocus) node.element.focus({preventScroll:true});
}
function frame(state,moveFocus=false){
  const id=selectedOf(state.view);
  if(state.view.type==='member-tree'&&state.view.scope==='branch'){focusNode(id,moveFocus);return;}
  fit();
  if(moveFocus) nodesById.get(id)?.element.focus({preventScroll:true});
}

function syncUrl(state){
  try{
    const id=selectedOf(state.view);
    const nextUrl=id!==null?'?member='+id:location.pathname||'tree.html';
    history.replaceState(null,'',nextUrl);
  }catch(e){}
}
function renderAll(state,opts={}){
  syncChrome(state);
  syncUrl(state);
  describe(state);
  if(state.view.type!=='founders'&&state.view.type!=='member-generations'){
    draw(state);
    if(selectedOf(state.view)!==null) frame(state,Boolean(opts.moveFocus));
    else fit();
  }
}

function selectMember(id,moveFocus){
  matches.replaceChildren();
  const next=treeMachine.send({type:'SELECT_MEMBER',memberId:id,branchRoot:rootOf(id)});
  renderAll(next,{moveFocus});
}
function showRoot(id){
  if(id>=0){selectMember(id,false);return;}
  query.value='';matches.replaceChildren();
  const next=id===UNRESOLVED
    ? treeMachine.send({type:'SHOW_UNRESOLVED',hasFloating:floating.length>0})
    : treeMachine.send({type:'SHOW_OVERVIEW'});
  renderAll(next);
}

desktopQuery.addEventListener('change',()=>{
  const next=treeMachine.send({type:'VIEWPORT_CHANGED',isPhone:!desktopQuery.matches});
  syncBranchOptions(next.isPhone);
  renderAll(next);
});
viewToggle.addEventListener('click',()=>{
  const next=treeMachine.send({type:'TOGGLE_POPOVER'});
  if(next.popover==='open') matches.replaceChildren();
  viewToggle.setAttribute('aria-expanded',String(next.popover==='open'));
});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&treeMachine.getState().popover==='open'){
    treeMachine.send({type:'CLOSE_POPOVER'});
    viewToggle.setAttribute('aria-expanded','false');
    viewToggle.focus();
  }
});
document.addEventListener('pointerdown',event=>{
  if(!event.target.closest('.tools')){
    treeMachine.send({type:'CLOSE_POPOVER'});
    viewToggle.setAttribute('aria-expanded','false');
  }
});
lineageSelect.addEventListener('change',()=>{
  const mode=lineageSelect.value;
  try{localStorage.setItem('kpib-lineage',mode);}catch(e){}
  buildLineage(mode);
  const cur=treeMachine.getState();
  const selected=selectedOf(cur.view);
  const next=treeMachine.send({
    type:'SET_LINEAGE_MODE',
    lineageMode:mode,
    hasFloating:floating.length>0,
    branchRoot:selected!==null?rootOf(selected):null,
  });
  syncBranchOptions(next.isPhone);
  renderAll(next);
});
select.addEventListener('change',()=>showRoot(Number(select.value)));
orientation.addEventListener('change',()=>{
  const next=treeMachine.send({type:'SET_ORIENTATION',orientation:orientation.value});
  syncChrome(next);
  if(next.view.type==='founders'||next.view.type==='member-generations') return;
  draw(next);
  if(selectedOf(next.view)===null) fit();
  else frame(next);
});
parentButton.addEventListener('click',()=>selectMember(parentOf[selectedOf(treeMachine.getState().view)],true));
pick('depth').addEventListener('change',()=>{
  const depthMode=pick('depth').checked?'full':'auto';
  try{localStorage.setItem('kpib-depth',depthMode==='full'?'full':'5');}catch(e){}
  const next=treeMachine.send({type:'SET_DEPTH_MODE',depthMode});
  renderAll(next);
});
modeButton.addEventListener('change',()=>{
  const next=treeMachine.send({type:'SET_SCOPE',scope:modeButton.checked?'downstream':'branch'});
  renderAll(next);
});
pick('viewTree').addEventListener('click',()=>{
  const prev=treeMachine.getState();
  const next=treeMachine.send({type:'SET_VIEW_MODE',mode:'tree'});
  if(next!==prev) renderAll(next);
});
pick('viewList').addEventListener('click',()=>{
  const prev=treeMachine.getState();
  const next=treeMachine.send({type:'SET_VIEW_MODE',mode:'generations'});
  if(next!==prev) renderAll(next);
});
connectionsButton.addEventListener('click',()=>{
  const next=treeMachine.send({type:'OPEN_CONNECTIONS'});
  if(next.connections==='open'){syncChrome(next);renderConnections(next);}
});
connectionsPanel.addEventListener('close',()=>treeMachine.send({type:'CLOSE_CONNECTIONS'}));
connectionsPanel.addEventListener('click',event=>{if(event.target===connectionsPanel) connectionsPanel.close();});
pick('zoomOut').addEventListener('click',()=>drawing.call(zoom.scaleBy,.8));
pick('zoomIn').addEventListener('click',()=>drawing.call(zoom.scaleBy,1.25));
pick('fit').addEventListener('click',fit);
canvas.addEventListener('keydown',event=>{
  if(event.target!==canvas) return;
  const direction={ArrowLeft:[1,0],ArrowRight:[-1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[event.key];
  if(!direction) return;
  event.preventDefault();
  const step=48/d3.zoomTransform(svg).k;
  drawing.call(zoom.translateBy,direction[0]*step,direction[1]*step);
});
pick('overview').addEventListener('click',()=>{
  showRoot(treeMachine.getState().isPhone?FOUNDERS:OVERVIEW);
  query.focus();
});
query.addEventListener('input',()=>matches.replaceChildren());
query.addEventListener('keydown',event=>{if(event.key==='Escape') matches.replaceChildren();});
pick('find').addEventListener('submit',event=>{
  event.preventDefault();
  const st=treeMachine.send({type:'CLOSE_POPOVER'});
  viewToggle.setAttribute('aria-expanded',String(st.popover==='open'));
  const term=normalizeMemberQuery(query.value);
  matches.replaceChildren();
  if(!term) return;
  const found=records.map((record,id)=>({name:record[0],record,id})).filter(({record})=>matchesMember(record,term));
  if(found.length===1){selectMember(found[0].id,true);return;}
  const label=document.createElement('span');
  label.textContent=found.length?found.length+' matches':'No matching names.';
  matches.append(label);
  for(const {name,id} of found){
    const result=document.createElement('button');result.type='button';
    const actual=document.createElement('strong');actual.textContent=records[id][3];
    const line=document.createElement('span');line.textContent=name;
    result.append(actual,line);
    result.addEventListener('click',()=>selectMember(id,true));matches.append(result);
  }
});

syncBranchOptions(treeMachine.getState().isPhone);
const startParams=new URLSearchParams(location.search);
const memberLink=startParams.get('member');
const startQuery=startParams.get('q');
const linkedMember=memberLink!==null&&/^\d+$/.test(memberLink)?Number(memberLink):null;
if(linkedMember!==null&&linkedMember<records.length) selectMember(linkedMember,false);
else renderAll(treeMachine.getState());
if(startQuery&&linkedMember===null){query.value=startQuery;document.getElementById('find').requestSubmit();}
new ResizeObserver(()=>{
  const st=treeMachine.getState();
  if(st.view.type==='overview'){fit();return;}
  if(st.depthMode!=='full'&&st.view.type!=='member-generations'&&st.view.type!=='founders'&&canvas.clientWidth&&defaultDepth(st)!==drawnDepth){
    draw(st);
    if(selectedOf(st.view)!==null) frame(st);
    else fit();
  }
}).observe(canvas);
</script>
